<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — DLX DMT Dispatch Hub</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Inter+Tight:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            bg: "#ffffff",
            surface: "#f9fafb",
            text: "#1a1a1a",
            muted: "#6b7280",
            green: "#16a34a",
            red: "#dc2626",
            bordercol: "#e5e7eb",
          },
          fontFamily: {
            sans: ['"Inter"', 'sans-serif'],
            display: ['"Inter Tight"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          }
        }
      }
    }
  </script>

  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
    .slide-in { animation: slideIn 0.15s ease-out; }
    @keyframes slideIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    input:focus { box-shadow: 0 0 0 2px rgba(0,0,0,0.06); }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="stylesheet" href="theme.css">
</head>
<body class="min-h-screen bg-surface text-text font-sans antialiased p-0 m-0">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const SUPABASE_URL = "https://mdutrtmdjodabggirntb.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1kdXRydG1kam9kYWJnZ2lybnRiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ5MDk3MzQsImV4cCI6MjA5MDQ4NTczNH0.GlrbsjnkBSwhnguBQUCb418NxvRO02PhXhBJZ69xTi4";
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // ── Shared UI ────────────────────────────────────────────
    const inputClass = "w-full px-3 py-2.5 bg-surface border border-bordercol rounded-md text-text text-[13px] font-mono outline-none transition-colors focus:border-black/30";
    const btnClass = "w-full py-2.5 bg-black rounded-md text-white text-[12px] font-semibold tracking-[0.06em] font-mono uppercase hover:bg-gray-800 disabled:opacity-30 cursor-pointer transition-colors";
    const labelClass = "block text-[10px] font-semibold tracking-[0.08em] text-muted mb-1.5 uppercase font-mono";

    function Logo() {
      return (
        <div className="flex items-center gap-3 mb-6">
          <div className="bg-black rounded-lg w-9 h-9 flex items-center justify-center text-lg font-bold text-white font-display">⇄</div>
          <div>
            <h1 className="text-xl font-bold tracking-tight text-text font-display" style={{letterSpacing: '-0.02em'}}>DLX DMT</h1>
            <p className="text-[10px] text-muted font-mono uppercase tracking-[0.08em]">Password Reset</p>
          </div>
        </div>
      );
    }

    function StatusMessage({ type, children }) {
      const styles = {
        error: "bg-red/5 border-red/20 text-red",
        success: "bg-green/5 border-green/20 text-green",
        info: "bg-surface border-bordercol text-muted",
      };
      return (
        <div className={`p-3 border rounded-lg text-xs font-mono leading-relaxed ${styles[type]}`}>
          {children}
        </div>
      );
    }

    // ── Request Reset (enter email) ──────────────────────────
    function RequestReset() {
      const [email, setEmail] = useState("");
      const [loading, setLoading] = useState(false);
      const [sent, setSent] = useState(false);
      const [error, setError] = useState(null);

      const handleRequest = async () => {
        if (!email) return;
        setLoading(true);
        setError(null);

        // redirectTo should point to wherever this reset page is hosted
        const redirectTo = window.location.origin + window.location.pathname;

        const { error: resetErr } = await sb.auth.resetPasswordForEmail(email, { redirectTo });

        if (resetErr) {
          setError(resetErr.message);
        } else {
          setSent(true);
        }
        setLoading(false);
      };

      if (sent) {
        return (
          <div className="slide-in">
            <Logo />
            <StatusMessage type="success">
              Check your inbox at <strong>{email}</strong>. Click the link in the email to set a new password. The link expires in 1 hour.
            </StatusMessage>
            <button onClick={() => { setSent(false); setEmail(""); }} className="mt-4 w-full py-2 bg-surface border border-bordercol rounded-md text-[11px] font-semibold tracking-[0.06em] font-mono text-muted hover:text-text hover:bg-white cursor-pointer transition-colors">
              ← Send Another
            </button>
          </div>
        );
      }

      return (
        <div className="slide-in">
          <Logo />
          <p className="text-sm text-muted mb-5 leading-relaxed">
            Enter the email address associated with your account and we'll send a password reset link.
          </p>
          <div className="mb-4">
            <label className={labelClass}>Email Address</label>
            <input
              type="email"
              value={email}
              onChange={e => setEmail(e.target.value)}
              onKeyDown={e => e.key === 'Enter' && handleRequest()}
              placeholder="you@oregontaxi.com"
              className={inputClass}
              autoFocus
            />
          </div>
          {error && <div className="mb-4"><StatusMessage type="error">{error}</StatusMessage></div>}
          <button onClick={handleRequest} disabled={loading || !email} className={btnClass}>
            {loading ? "Sending..." : "Send Reset Link"}
          </button>
        </div>
      );
    }

    // ── Set New Password (from email link) ───────────────────
    function SetNewPassword({ onComplete }) {
      const [password, setPassword] = useState("");
      const [confirm, setConfirm] = useState("");
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState(null);
      const [done, setDone] = useState(false);

      const valid = password.length >= 8 && password === confirm;

      const requirements = [
        { met: password.length >= 8, label: "At least 8 characters" },
        { met: /[A-Z]/.test(password), label: "One uppercase letter" },
        { met: /[0-9]/.test(password), label: "One number" },
        { met: password === confirm && confirm.length > 0, label: "Passwords match" },
      ];

      const handleUpdate = async () => {
        if (!valid) return;
        setLoading(true);
        setError(null);

        const { error: updateErr } = await sb.auth.updateUser({ password });

        if (updateErr) {
          setError(updateErr.message);
        } else {
          setDone(true);
          await sb.auth.signOut();
        }
        setLoading(false);
      };

      if (done) {
        return (
          <div className="slide-in">
            <Logo />
            <StatusMessage type="success">
              Password updated successfully. You can now sign in with your new password.
            </StatusMessage>
            <a href="/" className="block mt-4">
              <button className={btnClass}>Go to Sign In</button>
            </a>
          </div>
        );
      }

      return (
        <div className="slide-in">
          <Logo />
          <p className="text-sm text-muted mb-5 leading-relaxed">
            Choose a new password for your account.
          </p>
          <div className="mb-3">
            <label className={labelClass}>New Password</label>
            <input
              type="password"
              value={password}
              onChange={e => setPassword(e.target.value)}
              placeholder="••••••••••••"
              className={inputClass}
              autoFocus
            />
          </div>
          <div className="mb-4">
            <label className={labelClass}>Confirm Password</label>
            <input
              type="password"
              value={confirm}
              onChange={e => setConfirm(e.target.value)}
              onKeyDown={e => e.key === 'Enter' && valid && handleUpdate()}
              placeholder="••••••••••••"
              className={inputClass}
            />
          </div>

          {/* Requirements checklist */}
          <div className="mb-5 space-y-1.5">
            {requirements.map((r, i) => (
              <div key={i} className="flex items-center gap-2">
                <span className={`w-3.5 h-3.5 rounded-full border flex items-center justify-center text-[8px] font-bold transition-colors ${r.met ? 'bg-green border-green text-white' : 'border-bordercol text-transparent'}`}>✓</span>
                <span className={`text-[11px] font-mono transition-colors ${r.met ? 'text-green' : 'text-muted'}`}>{r.label}</span>
              </div>
            ))}
          </div>

          {error && <div className="mb-4"><StatusMessage type="error">{error}</StatusMessage></div>}
          <button onClick={handleUpdate} disabled={loading || !valid} className={btnClass}>
            {loading ? "Updating..." : "Update Password"}
          </button>
        </div>
      );
    }

    // ── App Router ───────────────────────────────────────────
    function App() {
      const [mode, setMode] = useState("loading"); // loading | request | recovery

      useEffect(() => {
        // Listen for the PASSWORD_RECOVERY event from the email link
        const { data: { subscription } } = sb.auth.onAuthStateChange((event, session) => {
          if (event === "PASSWORD_RECOVERY") {
            setMode("recovery");
          }
        });

        // Check if we already have a session from the URL hash
        sb.auth.getSession().then(({ data: { session } }) => {
          if (mode === "loading") {
            // If there's a recovery token in the URL hash, Supabase will fire PASSWORD_RECOVERY
            // Give it a moment, then fall back to request mode
            setTimeout(() => {
              setMode(prev => prev === "loading" ? "request" : prev);
            }, 500);
          }
        });

        return () => subscription.unsubscribe();
      }, []);

      return (
        <div className="min-h-screen flex items-center justify-center p-6">
          <div className="w-full max-w-sm bg-white border border-bordercol rounded-xl p-8">
            {mode === "loading" && (
              <div className="text-center py-8">
                <div className="text-muted font-mono text-sm">Checking session...</div>
              </div>
            )}
            {mode === "request" && <RequestReset />}
            {mode === "recovery" && <SetNewPassword />}
          </div>

          {/* Footer */}
          <div className="fixed bottom-0 left-0 right-0 py-3 text-center">
            <span className="text-[10px] text-muted font-mono">
              Oregon Taxi Eugene / Direct Medical Transport — DLX DMT Dispatch Hub
            </span>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
