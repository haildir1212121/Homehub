<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Directory — Employee Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="theme.css">
</head>
<body class="antialiased text-black bg-white">

<div class="flex h-screen overflow-hidden relative">

    <!-- Auth layer -->
    <div id="auth-layer" class="fixed inset-0 z-[100] bg-white flex items-center justify-center p-4">
        <div class="text-center">
            <div class="inline-flex items-center justify-center w-12 h-12 rounded-full bg-black text-white mb-4">
                <i class="ph-fill ph-spinner text-2xl animate-spin"></i>
            </div>
            <p class="text-sm text-gray-500">Authenticating...</p>
        </div>
    </div>

    <!-- Sidebar -->
    <aside class="flex flex-col flex-shrink-0 w-20 md:w-60 bg-white border-r border-gray-200 z-30 relative shadow-[1px_0_0_rgba(0,0,0,0.05)]">
        <a href="/index.html" class="flex items-center justify-center md:justify-start md:px-6 h-16 border-b border-gray-200 flex-shrink-0 bg-gray-50 w-full hover:bg-gray-100 transition-colors">
            <i class="ph-fill ph-squares-four text-3xl text-black"></i>
            <span class="ml-2 text-lg font-bold hidden md:block tracking-tight">Hub</span>
        </a>
        <div class="flex-1 overflow-y-auto custom-scroll p-4 space-y-1">
            <!-- Navigation -->
            <div class="text-xs font-bold text-gray-400 uppercase tracking-wide mb-3 hidden md:block">Navigation</div>
            <a href="/index.html" class="w-full flex items-center justify-center md:justify-start p-2 rounded-md bg-white text-gray-600 hover:bg-gray-100 hover:text-black transition-colors">
                <i class="ph-bold ph-app-window text-lg"></i>
                <span class="ml-3 text-sm font-bold hidden md:block">Applications</span>
            </a>
            <button class="w-full flex items-center justify-center md:justify-start p-2 rounded-md bg-black text-white transition-colors">
                <i class="ph-bold ph-address-book text-lg"></i>
                <span class="ml-3 text-sm font-bold hidden md:block">Directory</span>
            </button>

            <!-- Quick Launch (shown after login, role-filtered) -->
            <div id="quick-launch-section" class="hidden mt-4">
                <div class="text-xs font-bold text-gray-400 uppercase tracking-wide mb-3 hidden md:block">Quick Launch</div>
                <a href="/sms.html" data-roles="admin,dispatcher,jay" class="quick-launch-item w-full flex items-center justify-center md:justify-start p-2 rounded-md bg-white text-gray-600 hover:bg-gray-100 hover:text-black transition-colors">
                    <i class="ph-bold ph-chat-circle-text text-lg"></i>
                    <span class="ml-3 text-sm font-bold hidden md:block">SMS Tool</span>
                </a>
                <a href="/balances.html" data-roles="admin,jay,dispatcher" class="quick-launch-item w-full flex items-center justify-center md:justify-start p-2 rounded-md bg-white text-gray-600 hover:bg-gray-100 hover:text-black transition-colors">
                    <i class="ph-bold ph-wallet text-lg"></i>
                    <span class="ml-3 text-sm font-bold hidden md:block">Account Balances</span>
                </a>
                <a href="/repair-tracker.html" data-roles="admin,jay,maintenance,dispatcher" class="quick-launch-item w-full flex items-center justify-center md:justify-start p-2 rounded-md bg-white text-gray-600 hover:bg-gray-100 hover:text-black transition-colors">
                    <i class="ph-bold ph-wrench text-lg"></i>
                    <span class="ml-3 text-sm font-bold hidden md:block">Repair Tracker</span>
                </a>
            </div>

            <!-- More -->
            <div class="mt-4">
                <div class="text-xs font-bold text-gray-400 uppercase tracking-wide mb-3 hidden md:block">More</div>
                <a href="/index.html" class="w-full flex items-center justify-center md:justify-start p-2 rounded-md bg-white text-gray-600 hover:bg-gray-100 hover:text-black transition-colors">
                    <i class="ph-bold ph-gear text-lg"></i>
                    <span class="ml-3 text-sm font-bold hidden md:block">Settings</span>
                </a>
            </div>
        </div>
        <div class="p-4 border-t border-gray-200 flex items-center justify-center md:justify-between bg-white">
            <div class="flex items-center overflow-hidden">
                <div class="h-8 w-8 flex-shrink-0 rounded-full bg-black flex items-center justify-center text-white font-bold text-xs" id="user-avatar">?</div>
                <div class="hidden md:flex flex-col ml-2 min-w-0">
                    <span id="logged-user-name" class="text-xs font-bold text-black truncate w-32">Guest</span>
                    <span id="user-role" class="text-[9px] uppercase tracking-wider text-gray-500">Waiting</span>
                </div>
            </div>
            <button onclick="logout()" class="text-gray-400 hover:text-red-600 ml-2 flex-shrink-0" title="Logout">
                <i class="ph-bold ph-sign-out text-lg"></i>
            </button>
        </div>
    </aside>

    <!-- Main content -->
    <main class="flex-1 flex flex-col h-full overflow-hidden bg-[#faf9f8] relative z-10">
        <div class="flex-1 overflow-y-auto p-4 sm:p-8 custom-scroll">

            <header class="flex flex-col sm:flex-row sm:items-end justify-between mb-6 pb-4 border-b border-gray-200">
                <div>
                    <h1 class="text-2xl font-bold text-black tracking-tight">Directory</h1>
                    <p class="text-sm text-gray-500 mt-1" id="contact-count">Loading contacts...</p>
                </div>
                <div class="mt-4 sm:mt-0 flex items-center gap-3">
                    <div class="relative">
                        <i class="ph ph-magnifying-glass absolute left-3 top-2.5 text-gray-400 text-lg"></i>
                        <input type="text" id="search-input" placeholder="Search contacts..." class="w-full sm:w-64 bg-white border border-gray-300 text-black text-sm rounded-md pl-10 p-2 focus:border-black focus:ring-0">
                    </div>
                    <button onclick="openModal('contact')" class="bg-black hover:bg-gray-800 text-white text-sm font-bold px-4 py-2 rounded-md flex items-center gap-2 whitespace-nowrap transition-colors">
                        <i class="ph-bold ph-plus text-base"></i>
                        <span class="hidden sm:inline">Add Contact</span>
                    </button>
                </div>
            </header>

            <div class="flex items-center gap-2 mb-6 overflow-x-auto pb-1" id="group-tabs">
                <button onclick="filterGroup(null)" class="group-tab active text-xs font-bold px-3 py-1.5 rounded-full border border-black bg-black text-white whitespace-nowrap transition-colors" data-group="all">All</button>
            </div>

            <div class="bg-white border border-gray-200 rounded-lg overflow-hidden shadow-sm">
                <div class="hidden sm:grid grid-cols-12 gap-4 px-6 py-3 bg-gray-50 border-b border-gray-200 text-[10px] font-bold text-gray-400 uppercase tracking-wider">
                    <div class="col-span-4">Name</div>
                    <div class="col-span-3">Phone</div>
                    <div class="col-span-3">Email</div>
                    <div class="col-span-2">Groups</div>
                </div>
                <div id="contacts-list" class="divide-y divide-gray-100">
                    <div class="p-12 text-center text-sm text-gray-400">Loading...</div>
                </div>
            </div>

            <div class="mt-6 flex items-center justify-between">
                <button onclick="openModal('manage-groups')" class="text-xs font-bold text-gray-400 hover:text-black transition-colors flex items-center gap-1">
                    <i class="ph-bold ph-tag text-sm"></i> Manage Groups
                </button>
            </div>

        </div>
    </main>
</div>

<!-- Contact Modal -->
<div id="modal-backdrop" class="fixed inset-0 z-50 hidden modal-backdrop flex items-center justify-center p-4" onclick="if(event.target===this)closeModal()">
    <div class="bg-white w-full max-w-lg rounded-lg border border-black shadow-lg slide-in max-h-[90vh] overflow-y-auto">
        <div class="flex items-center justify-between px-6 py-4 border-b border-gray-200">
            <h2 id="modal-title" class="text-lg font-bold">Add Contact</h2>
            <button onclick="closeModal()" class="text-gray-400 hover:text-black"><i class="ph-bold ph-x text-lg"></i></button>
        </div>
        <div id="modal-body" class="px-6 py-5"></div>
    </div>
</div>

<script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

    const SUPABASE_URL = 'https://ioofrqvykvgshqybzjiu.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imlvb2ZycXZ5a3Znc2hxeWJ6aml1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ5NjcxNzcsImV4cCI6MjA5MDU0MzE3N30.E3Kd88OXGGIc6GRmaVJaJwTilLuPksqyYPYSBEyECUQ';

    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentUser = null;
    let contacts = [];
    let groups = [];
    let activeGroup = null;
    let editingContactId = null;

    function showQuickLaunch(role) {
        const section = document.getElementById('quick-launch-section');
        section.classList.remove('hidden');
        document.querySelectorAll('.quick-launch-item').forEach(item => {
            const allowedRoles = (item.dataset.roles || '').split(',');
            const hasAccess = role === 'admin' || allowedRoles.includes(role);
            item.classList.toggle('hidden', !hasAccess);
        });
    }

    async function checkSession() {
        const { data: { session } } = await supabase.auth.getSession();
        if (!session) { window.location.href = '/index.html'; return; }
        const { data: profile } = await supabase.from('profiles').select('full_name, role').eq('id', session.user.id).maybeSingle();
        currentUser = { id: session.user.id, email: session.user.email, name: profile?.full_name || session.user.email.split('@')[0], role: profile?.role || 'employee' };
        initUI();
        await loadData();
    }
    checkSession();

    window.logout = async function() { await supabase.auth.signOut(); window.location.href = '/index.html'; };

    function initUI() {
        document.getElementById('auth-layer').classList.add('hidden');
        const parts = currentUser.name.split(' ');
        const formatted = parts.map(p => p.charAt(0).toUpperCase() + p.slice(1)).join(' ');
        document.getElementById('logged-user-name').textContent = formatted;
        document.getElementById('user-role').textContent = currentUser.role;
        let initials = formatted.substring(0, 2).toUpperCase();
        if (parts.length > 1) initials = (parts[0][0] + parts[1][0]).toUpperCase();
        document.getElementById('user-avatar').textContent = initials;
        showQuickLaunch(currentUser.role);
    }

    async function loadData() {
        await Promise.all([loadGroups(), loadContacts()]);
        render();
    }

    async function loadGroups() {
        const { data, error } = await supabase.from('contact_groups').select('*').order('name');
        if (!error) groups = data || [];
    }

    async function loadContacts() {
        const { data, error } = await supabase.from('contacts').select('*, contact_group_members(group_id)').order('last_name, first_name');
        if (!error) contacts = data || [];
    }

    function render() { renderGroupTabs(); renderContacts(); }

    function renderGroupTabs() {
        const container = document.getElementById('group-tabs');
        container.innerHTML = `<button onclick="filterGroup(null)" class="group-tab text-xs font-bold px-3 py-1.5 rounded-full border whitespace-nowrap transition-colors ${activeGroup === null ? 'border-black bg-black text-white' : 'border-gray-300 bg-white text-gray-600 hover:border-black hover:text-black'}" data-group="all">All</button>`;
        groups.forEach(g => {
            const active = activeGroup === g.id;
            container.innerHTML += `<button onclick="filterGroup('${g.id}')" class="group-tab text-xs font-bold px-3 py-1.5 rounded-full border whitespace-nowrap transition-colors ${active ? 'border-black bg-black text-white' : 'border-gray-300 bg-white text-gray-600 hover:border-black hover:text-black'}">${g.name}</button>`;
        });
    }

    window.filterGroup = function(groupId) { activeGroup = groupId; render(); };

    function renderContacts() {
        const query = document.getElementById('search-input').value.toLowerCase();
        let filtered = contacts;
        if (activeGroup) { filtered = filtered.filter(c => c.contact_group_members?.some(m => m.group_id === activeGroup)); }
        if (query) { filtered = filtered.filter(c => { const full = `${c.first_name} ${c.last_name} ${c.email || ''} ${c.phone || ''} ${c.company || ''}`.toLowerCase(); return full.includes(query); }); }

        document.getElementById('contact-count').textContent = `${filtered.length} contact${filtered.length !== 1 ? 's' : ''}`;
        const list = document.getElementById('contacts-list');
        if (filtered.length === 0) { list.innerHTML = `<div class="p-12 text-center"><div class="bg-gray-200 p-4 rounded-full inline-block mb-3"><i class="ph-fill ph-address-book text-2xl text-gray-500"></i></div><p class="text-sm text-gray-400">No contacts found</p></div>`; return; }

        list.innerHTML = filtered.map(c => {
            const memberGroups = (c.contact_group_members || []).map(m => groups.find(g => g.id === m.group_id)).filter(Boolean);
            const groupTags = memberGroups.map(g => `<span class="tag bg-gray-100 text-gray-600">${g.name}</span>`).join(' ');
            const initials = ((c.first_name?.[0] || '') + (c.last_name?.[0] || '')).toUpperCase() || '?';
            return `
                <div class="contact-row grid grid-cols-1 sm:grid-cols-12 gap-1 sm:gap-4 px-6 py-4 cursor-pointer items-center" onclick="openEditContact('${c.id}')">
                    <div class="sm:col-span-4 flex items-center gap-3">
                        <div class="h-8 w-8 flex-shrink-0 rounded-full bg-gray-100 border border-gray-200 flex items-center justify-center text-xs font-bold text-gray-500">${initials}</div>
                        <div class="min-w-0">
                            <div class="text-sm font-bold text-black truncate">${c.first_name || ''} ${c.last_name || ''}</div>
                            ${c.company ? `<div class="text-[11px] text-gray-400 truncate">${c.company}</div>` : ''}
                        </div>
                    </div>
                    <div class="sm:col-span-3 text-sm text-gray-600 truncate pl-11 sm:pl-0">${c.phone || '<span class="text-gray-300">—</span>'}</div>
                    <div class="sm:col-span-3 text-sm text-gray-600 truncate pl-11 sm:pl-0">${c.email || '<span class="text-gray-300">—</span>'}</div>
                    <div class="sm:col-span-2 flex flex-wrap gap-1 pl-11 sm:pl-0">${groupTags || '<span class="text-gray-300 text-xs">—</span>'}</div>
                </div>`;
        }).join('');
    }

    document.getElementById('search-input').addEventListener('input', renderContacts);

    window.openModal = function(type, data) {
        const backdrop = document.getElementById('modal-backdrop');
        const title = document.getElementById('modal-title');
        const body = document.getElementById('modal-body');
        backdrop.classList.remove('hidden');

        if (type === 'contact') {
            editingContactId = data?.id || null;
            title.textContent = editingContactId ? 'Edit Contact' : 'Add Contact';
            const c = data || {};
            const memberGroupIds = (c.contact_group_members || []).map(m => m.group_id);
            body.innerHTML = `
                <div class="space-y-4">
                    <div class="grid grid-cols-2 gap-4">
                        <div><label class="block text-xs font-bold text-black mb-1">First Name</label><input id="f-first" type="text" value="${c.first_name || ''}" class="w-full border border-gray-300 rounded-md p-2 text-sm focus:border-black focus:ring-0" placeholder="John"></div>
                        <div><label class="block text-xs font-bold text-black mb-1">Last Name</label><input id="f-last" type="text" value="${c.last_name || ''}" class="w-full border border-gray-300 rounded-md p-2 text-sm focus:border-black focus:ring-0" placeholder="Doe"></div>
                    </div>
                    <div><label class="block text-xs font-bold text-black mb-1">Phone</label><input id="f-phone" type="tel" value="${c.phone || ''}" class="w-full border border-gray-300 rounded-md p-2 text-sm focus:border-black focus:ring-0" placeholder="(541) 555-1234"></div>
                    <div><label class="block text-xs font-bold text-black mb-1">Email</label><input id="f-email" type="email" value="${c.email || ''}" class="w-full border border-gray-300 rounded-md p-2 text-sm focus:border-black focus:ring-0" placeholder="john@example.com"></div>
                    <div><label class="block text-xs font-bold text-black mb-1">Company</label><input id="f-company" type="text" value="${c.company || ''}" class="w-full border border-gray-300 rounded-md p-2 text-sm focus:border-black focus:ring-0" placeholder="Acme Inc."></div>
                    <div><label class="block text-xs font-bold text-black mb-1">Notes</label><textarea id="f-notes" rows="2" class="w-full border border-gray-300 rounded-md p-2 text-sm focus:border-black focus:ring-0" placeholder="Optional notes...">${c.notes || ''}</textarea></div>
                    <div><label class="block text-xs font-bold text-black mb-2">Groups</label><div class="flex flex-wrap gap-2" id="group-checkboxes">${groups.map(g => `<label class="flex items-center gap-1.5 text-sm cursor-pointer"><input type="checkbox" value="${g.id}" class="rounded border-gray-300 text-black focus:ring-0" ${memberGroupIds.includes(g.id) ? 'checked' : ''}> ${g.name}</label>`).join('')}${groups.length === 0 ? '<span class="text-xs text-gray-400">No groups yet</span>' : ''}</div></div>
                    <div class="flex items-center justify-between pt-2 border-t border-gray-100">
                        ${editingContactId ? '<button onclick="deleteContact()" class="text-xs font-bold text-red-500 hover:text-red-700 transition-colors">Delete Contact</button>' : '<div></div>'}
                        <button onclick="saveContact()" class="bg-black hover:bg-gray-800 text-white text-sm font-bold px-5 py-2 rounded-md transition-colors">Save</button>
                    </div>
                </div>`;
        } else if (type === 'manage-groups') {
            title.textContent = 'Manage Groups';
            body.innerHTML = `<div class="space-y-4"><div class="flex gap-2"><input id="new-group-name" type="text" placeholder="New group name..." class="flex-1 border border-gray-300 rounded-md p-2 text-sm focus:border-black focus:ring-0"><button onclick="addGroup()" class="bg-black hover:bg-gray-800 text-white text-sm font-bold px-4 py-2 rounded-md transition-colors">Add</button></div><div id="groups-list" class="divide-y divide-gray-100">${renderGroupsList()}</div></div>`;
        }
    };

    function renderGroupsList() {
        if (groups.length === 0) return '<p class="text-sm text-gray-400 py-4 text-center">No groups yet</p>';
        return groups.map(g => `<div class="flex items-center justify-between py-3"><span class="text-sm font-medium">${g.name}</span><button onclick="deleteGroup('${g.id}')" class="text-xs font-bold text-red-500 hover:text-red-700 transition-colors">Remove</button></div>`).join('');
    }

    window.closeModal = function() { document.getElementById('modal-backdrop').classList.add('hidden'); editingContactId = null; };
    window.openEditContact = function(id) { const c = contacts.find(x => x.id === id); if (c) openModal('contact', c); };

    window.saveContact = async function() {
        const payload = { first_name: document.getElementById('f-first').value.trim(), last_name: document.getElementById('f-last').value.trim(), phone: document.getElementById('f-phone').value.trim(), email: document.getElementById('f-email').value.trim(), company: document.getElementById('f-company').value.trim(), notes: document.getElementById('f-notes').value.trim() };
        if (!payload.first_name && !payload.last_name) { alert('Please enter a name.'); return; }
        const selectedGroups = [...document.querySelectorAll('#group-checkboxes input:checked')].map(cb => cb.value);
        let contactId = editingContactId;
        if (editingContactId) { await supabase.from('contacts').update(payload).eq('id', editingContactId); }
        else { const { data } = await supabase.from('contacts').insert(payload).select().single(); contactId = data?.id; }
        if (contactId) {
            await supabase.from('contact_group_members').delete().eq('contact_id', contactId);
            if (selectedGroups.length > 0) { await supabase.from('contact_group_members').insert(selectedGroups.map(gid => ({ contact_id: contactId, group_id: gid }))); }
        }
        closeModal(); await loadData();
    };

    window.deleteContact = async function() {
        if (!editingContactId || !confirm('Delete this contact?')) return;
        await supabase.from('contact_group_members').delete().eq('contact_id', editingContactId);
        await supabase.from('contacts').delete().eq('id', editingContactId);
        closeModal(); await loadData();
    };

    window.addGroup = async function() {
        const name = document.getElementById('new-group-name').value.trim();
        if (!name) return;
        await supabase.from('contact_groups').insert({ name });
        await loadGroups();
        document.getElementById('groups-list').innerHTML = renderGroupsList();
        document.getElementById('new-group-name').value = '';
    };

    window.deleteGroup = async function(id) {
        if (!confirm('Delete this group? Contacts will NOT be deleted.')) return;
        await supabase.from('contact_group_members').delete().eq('group_id', id);
        await supabase.from('contact_groups').delete().eq('id', id);
        if (activeGroup === id) activeGroup = null;
        await loadGroups();
        document.getElementById('groups-list').innerHTML = renderGroupsList();
        renderGroupTabs(); renderContacts();
    };
</script>
</body>
</html>
